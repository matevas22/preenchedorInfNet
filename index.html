<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preenchedor INFNET - Caderno de Respostas</title>
    <!-- Highlight.js para realce de código na pré-visualização -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- Alternador de Modo Escuro -->
      <div class="ui-switch" style="margin-top: 15px; margin-left: 9px; z-index: 1000">
        <input type="checkbox" id="toggle-dark-mode" />
        <label for="toggle-dark-mode" class="slider">
          <span class="circle"></span>
        </label>
      </div>

      <!-- Logo do Instituto Infnet -->
      <div class="logo-container" style="height: auto; margin: 20px auto">
        <img
          src="image.png"
          alt="Logo Instituto Infnet"
          class="logo rotating-logo"
          style="width: 180px; margin-top: 0; border-radius: 50%"
          onerror="this.src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSPXaAjZVhjBUsSlKFLvYODUlSyVDUItTwRJA&s'"
        />
      </div>

      <div class="form-container">
        <div class="form-group">
          <label for="tipoTeste">Tipo de Avaliação:</label>
          <select id="tipoTeste" class="curso-select">
            <option value="Teste de Performance">Teste de Performance (TP)</option>
            <option value="Live Coding">Live Coding</option>
            <option value="Assessment">Assessment (AT)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="numeroTeste">Número da Avaliação:</label>
          <input type="number" id="numeroTeste" min="1" value="1" placeholder="Ex: 1" />
        </div>

        <div class="form-group">
          <label for="dataDocumento">Data do Preenchimento:</label>
          <input type="date" id="dataDocumento" />
        </div>

        <div class="form-group">
          <label for="nomeCurso">Nome do Curso:</label>
          <select id="nomeCurso" class="curso-select">
            <option value="">Selecione um curso</option>
            <option value="Engenharia de Software">Engenharia de Software</option>
            <option value="Engenharia da Computação">Engenharia da Computação</option>
            <option value="Engenharia de Dados e IA">Engenharia de Dados e IA</option>
            <option value="Análise e Desenvolvimento de Sistemas">Análise e Desenvolvimento de Sistemas</option>
          </select>
        </div>

        <div class="form-group">
          <div class="secao-header-inline">
            <label for="nomeMateria">Nome da Matéria / Disciplina:</label>
            <span class="sublabel-info">Selecione uma matéria salva ou digite uma nova</span>
          </div>
          <div class="campo-com-adicionar">
            <input
              type="text"
              id="nomeMateria"
              list="listaMaterias"
              placeholder="Digite ou selecione a matéria (ex: Desenvolvimento Web)"
              autocomplete="off"
            />
            <datalist id="listaMaterias"></datalist>
            <button type="button" id="btnSalvarMateria" class="btn-salvar-chip" title="Salvar matéria na lista para reutilizar">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
              </svg>
              Salvar
            </button>
          </div>
          <div id="containerHistoricoMaterias" class="historico-container">
            <span class="historico-rotulo">Matérias salvas:</span>
            <div id="chipsMaterias" class="chips-list"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="nomeAluno">Nome do Aluno:</label>
          <input type="text" id="nomeAluno" placeholder="Seu Nome Completo" />
        </div>

        <div class="form-group">
          <div class="secao-header-inline">
            <label for="nomeProfessor">Nome do Professor(a):</label>
            <span class="sublabel-info">Selecione um professor salvo ou digite um novo</span>
          </div>
          <div class="campo-com-adicionar">
            <input
              type="text"
              id="nomeProfessor"
              list="listaProfessores"
              placeholder="Digite ou selecione o professor (ex: Prof. Carlos Eduardo)"
              autocomplete="off"
            />
            <datalist id="listaProfessores"></datalist>
            <button type="button" id="btnSalvarProfessor" class="btn-salvar-chip" title="Salvar professor na lista para reutilizar">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
              </svg>
              Salvar
            </button>
          </div>
          <div id="containerHistoricoProfessores" class="historico-container">
            <span class="historico-rotulo">Professores salvos:</span>
            <div id="chipsProfessores" class="chips-list"></div>
          </div>
        </div>

        <!-- Links de Respostas (Controle flexível de quantidade) -->
        <div class="form-group">
          <div class="secao-header-inline">
            <label>Links de Respostas (Questões):</label>
            <span class="sublabel-info" id="contador-questoes">1 linha</span>
          </div>

          <!-- Barra de Quantidade de Linhas -->
          <div class="controle-questoes-bar">
            <div class="questoes-acoes-rapidas">
              <span class="label-controle">Qtd de linhas:</span>
              <button type="button" class="btn-qtd-rapida active" data-qtd="1">1</button>
              <button type="button" class="btn-qtd-rapida" data-qtd="4">4</button>
              <button type="button" class="btn-qtd-rapida" data-qtd="8">8</button>
              <button type="button" class="btn-qtd-rapida" data-qtd="12">12</button>
              <button type="button" class="btn-qtd-rapida" data-qtd="16">16</button>
            </div>

            <div class="questoes-personalizada">
              <label for="qtdLinhasInput" class="label-controle">Personalizar:</label>
              <input type="number" id="qtdLinhasInput" min="1" max="50" value="1" class="input-qtd-personalizada" />
              <button type="button" id="btnAplicarQtd" class="btn-aplicar-qtd" title="Definir quantidade exata de linhas">
                Definir
              </button>
            </div>
          </div>

          <div id="respostas-container">
            <!-- Linhas geradas via JavaScript (Padrão: 1 linha) -->
          </div>

          <div class="rodape-acoes-questoes">
            <button type="button" id="adicionar-resposta" class="btn-adicionar-questao">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              Adicionar +1 Linha
            </button>
            <button type="button" id="btnRemoverVazias" class="btn-remover-vazias" title="Remover todas as linhas sem link">
              Limpar Vazias
            </button>
          </div>
        </div>

        <!-- Editor Markdown Moderno -->
        <div class="form-group">
          <div class="secao-header-inline">
            <label>Respostas e Conteúdo em Markdown:</label>
          </div>

          <div class="markdown-editor-box">
            <!-- Barra Superior com Abas e Ações de Arquivo -->
            <div class="md-editor-header">
              <div class="md-tabs">
                <button type="button" id="tab-escrever" class="md-tab-btn active" title="Editar código Markdown">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                  </svg>
                  Escrever Markdown
                </button>
                <button type="button" id="tab-preview" class="md-tab-btn" title="Visualizar documento formatado">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  Pré-visualização
                </button>
              </div>

              <div class="md-file-actions">
                <input type="file" id="inputImportarMd" accept=".md,.markdown,.txt" style="display: none;" />
                <button type="button" id="btnImportarMd" class="md-action-btn" title="Carregar um arquivo .md do computador">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    <line x1="12" y1="11" x2="12" y2="17"></line>
                    <polyline points="9 14 12 11 15 14"></polyline>
                  </svg>
                  Importar .md
                </button>
                <button type="button" id="btnExportarMd" class="md-action-btn" title="Baixar texto em formato .md">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                  </svg>
                  Baixar .md
                </button>
                <button type="button" id="btnLimparMd" class="md-action-btn btn-limpar" title="Limpar editor">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  </svg>
                  Limpar
                </button>
              </div>
            </div>

            <!-- Barra de Ferramentas com Atalhos Markdown -->
            <div class="md-toolbar">
              <div class="md-btn-group">
                <button type="button" class="md-btn" data-md-action="bold" title="Negrito (**texto**)"><strong>B</strong></button>
                <button type="button" class="md-btn" data-md-action="italic" title="Itálico (*texto*)"><em>I</em></button>
                <button type="button" class="md-btn" data-md-action="strike" title="Tachado (~~texto~~)"><s>S</s></button>
                <button type="button" class="md-btn" data-md-action="code" title="Código Inline (`código`)"><code>&lt;&gt;</code></button>
              </div>

              <div class="md-btn-group">
                <button type="button" class="md-btn" data-md-action="h1" title="Título 1 (#)">H1</button>
                <button type="button" class="md-btn" data-md-action="h2" title="Título 2 (##)">H2</button>
                <button type="button" class="md-btn" data-md-action="h3" title="Título 3 (###)">H3</button>
              </div>

              <div class="md-btn-group">
                <button type="button" class="md-btn" data-md-action="ul" title="Lista com Marcadores (- )">• Lista</button>
                <button type="button" class="md-btn" data-md-action="ol" title="Lista Numerada (1. )">1. Lista</button>
                <button type="button" class="md-btn" data-md-action="checklist" title="Checklist (- [ ] )">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 11 12 14 22 4"></polyline>
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                  </svg>
                  Tarefa
                </button>
              </div>

              <div class="md-btn-group">
                <button type="button" class="md-btn" data-md-action="codeblock" title="Bloco de Código (```linguagem)">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                  </svg>
                  Bloco de Código
                </button>
                <button type="button" class="md-btn" data-md-action="quote" title="Citação (&gt; )">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
                    <path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"></path>
                  </svg>
                  Citação
                </button>
                <button type="button" class="md-btn" data-md-action="table" title="Tabela Markdown">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <line x1="3" y1="15" x2="21" y2="15"></line>
                    <line x1="12" y1="3" x2="12" y2="21"></line>
                  </svg>
                  Tabela
                </button>
                <button type="button" class="md-btn" data-md-action="link" title="Link ([texto](url))">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                  </svg>
                  Link
                </button>
                <button type="button" class="md-btn" data-md-action="image" title="Imagem (![alt](url))">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                  </svg>
                  Imagem
                </button>
                <button type="button" class="md-btn" data-md-action="hr" title="Linha Divisória (---)">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                  </svg>
                  Divisor
                </button>
              </div>
            </div>

            <!-- Painel de Edição -->
            <div id="container-escrever" class="md-pane-container">
              <textarea
                id="editor-markdown"
                class="md-textarea"
                placeholder="Escreva ou cole suas respostas em formato Markdown aqui... Pressione Tab para indentar o código."
                rows="16"
              ></textarea>
            </div>

            <!-- Painel de Pré-visualização -->
            <div id="container-preview" class="md-pane-container" style="display: none;">
              <div id="editor-markdown-preview" class="md-preview-content"></div>
            </div>
          </div>
        </div>

        <!-- Botão Salvar -->
        <button id="salvarNumero" class="save-button" type="button">
          <div class="svg-wrapper-1">
            <div class="svg-wrapper">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="30"
                height="30"
                class="icon"
              >
                <path
                  d="M22,15.04C22,17.23 20.24,19 18.07,19H5.93C3.76,19 2,17.23 2,15.04C2,13.07 3.43,11.44 5.31,11.14C5.28,11 5.27,10.86 5.27,10.71C5.27,9.33 6.38,8.2 7.76,8.2C8.37,8.2 8.94,8.43 9.37,8.8C10.14,7.05 11.13,5.44 13.91,5.44C17.28,5.44 18.87,8.06 18.87,10.83C18.87,10.94 18.87,11.06 18.86,11.17C20.65,11.54 22,13.13 22,15.04Z"
                ></path>
              </svg>
            </div>
          </div>
          <span>Salvar Alterações</span>
        </button>

        <!-- Sugestão do Nome do Arquivo Infnet -->
        <div class="sugestao-nome-container">
          <span class="sugestao-titulo">Padrão de Nome do PDF (Infnet):</span>
          <code id="previewNomeArquivo">aluno_disciplina_TP1.pdf</code>
        </div>

        <div id="status" class="status"></div>
      </div>

      <!-- Botão para Abrir o Documento Final -->
      <div class="document-link">
        <button type="button" id="abrirDocumento" class="modern-button">
          <span class="button-text">Abrir Caderno de Respostas (PDF)</span>
          <div class="button-loading">
            <div class="loading-spinner"></div>
            Processando...
          </div>
          <svg
            class="button-icon"
            stroke="currentColor"
            fill="currentColor"
            stroke-width="0"
            viewBox="0 0 512 512"
            height="16"
            width="16"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="m476.59 227.05-.16-.07L49.35 49.84A23.56 23.56 0 0 0 27.14 52 24.65 24.65 0 0 0 16 72.59v113.29a24 24 0 0 0 19.52 23.57l232.93 43.07a4 4 0 0 1 0 7.86L35.53 303.45A24 24 0 0 0 16 327v113.31A23.57 23.57 0 0 0 26.59 460a23.94 23.94 0 0 0 13.22 4 24.55 24.55 0 0 0 9.52-1.93L476.4 285.94l.19-.09a32 32 0 0 0 0-58.8z"
            ></path>
          </svg>
        </button>
      </div>

      <div class="footer-credit">Instituto Infnet • Gerador de Caderno de Respostas</div>
    </div>

    <!-- Scripts de Terceiros para Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Script da Aplicação -->
    <script src="script.js"></script>
    <script>
      // Modo escuro
      function setDarkMode(enabled) {
        const toggleSwitch = document.getElementById("toggle-dark-mode");
        if (enabled) {
          document.body.classList.add("dark-mode");
          toggleSwitch.checked = true;
          localStorage.setItem("darkMode", "1");
        } else {
          document.body.classList.remove("dark-mode");
          toggleSwitch.checked = false;
          localStorage.setItem("darkMode", "0");
        }
      }

      document
        .getElementById("toggle-dark-mode")
        .addEventListener("change", function () {
          setDarkMode(this.checked);
        });

      if (localStorage.getItem("darkMode") === "1") {
        setDarkMode(true);
      }

      // Botão Abrir Arquivo
      document
        .getElementById("abrirDocumento")
        .addEventListener("click", function () {
          this.classList.add("loading");
          setTimeout(() => {
            window.open("respostas/modelo.html", "_blank");
            this.classList.remove("loading");
          }, 400);
        });
    </script>
  </body>
</html>
